[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-resolved"
version = "0.1.0"
description = "Local Osmo footage intelligence and DaVinci Resolve selects automation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]
diarization = [
  "resemblyzer>=0.1.4",
  "librosa>=1.0",
  "scikit-learn>=1.9",
  # webrtcvad (a resemblyzer dependency) still does `import pkg_resources`
  # unconditionally at import time. setuptools>=81 dropped that module, which
  # breaks the import chain with no error until you actually try to diarize.
  # Confirmed on this machine (Python 3.14, setuptools 84) 2026-09-29.
  "setuptools<81",
]

[project.scripts]
clip-resolved = "clip_resolved.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
